- title: "Negative Vaccine Information and Adverse Event after COVID-19 Vaccination: Evidence from the Official Recognition of Causality in Korea"
  authors: "with Sangbeom Kim, Dae-il Kim, [Sok Chul Hong](https://sites.google.com/site/sokchulhong/)"
  link_text: "Slides"
  file: /assets/Negative_Information_and_Adverse_Event.pdf
  updated: 2026-04-24
  abstract: |
    Information plays a crucial role in shaping vaccine-related behaviors. However, because the timing of exposure to vaccine information can trigger responses at different margins, focusing solely on vaccination uptake risks underestimating the overall effect of information. We exploit a major information shock—the Korean government's recognition of a causal link between the Pfizer-BioNTech vaccine and myocarditis/pericarditis—to investigate its impact on healthcare utilization after vaccination. Using the K-COV-N cohort, an administrative dataset linking vaccination records and health insurance claims, we implement a difference-in-differences framework comparing individuals vaccinated around the announcement with not-yet-vaccinated controls. We find that exposure to the announcement increased adverse event–related healthcare utilization by about one percentage point from a 4.5% baseline.

- title: "Evaluating Population-Based Cognitive Screening: Evidence from Korea" 
  authors: "with Jooho Moon, [Sok Chul Hong](https://sites.google.com/site/sokchulhong/)" 
  abstract: | 
    Early diagnosis is the entry point to dementia care, and detection typically relies on brief cognitive screening as a first-stage filter. However, because screening cutoffs are derived to optimize diagnostic accuracy in case-control samples, and because pursuing confirmatory diagnosis after a positive screen is a voluntary choice, development-setting accuracy does not transfer cleanly to routine operation—real-world evidence is needed to inform the divergent policy choices health systems have already made. We exploit the cutoff of the KDSQ-C, a cognitive screening questionnaire embedded in Korea's National Health Screening Program, to investigate the effect of a positive screen on dementia-related diagnosis and care. Using the National Health Information Database, an administrative dataset linking health screening records, medical claims, and long-term care records, we implement a regression discontinuity design in the screening score. We find that crossing the screening cutoff increases dementia-related healthcare utilization within one year by about two percentage points from a 7.2% baseline, driven almost entirely by mild cognitive impairment. Among those who initiate care, screening-induced utilizers are no less likely than always-takers to receive a confirmed diagnosis or to sustain care, suggesting no systematic over-detection at the margin.

- title: "Non-Marital Births and Marriage Postponement in South Korea"
  authors: "with Dae-il Kim, [Sok Chul Hong](https://sites.google.com/site/sokchulhong/)"
  abstract: |
    During the COVID-19 pandemic, a steep increase in non-marital births was observed in South Korea, particularly among older mothers. We test the hypothesis that the increase in non marital births is a result of marriage delays caused by the pandemic. The COVID-19 pandemic likely raised the costs of marriage due to infection risks and quarantine policies restricting weddings. By exploiting variations in COVID-19 infection risk and wedding restrictions, this research will assess the pandemic's impact on marriage postponements and explore whether non-marital births served as a strategy to offset the anticipated decline in child health due to delayed childbirth.
